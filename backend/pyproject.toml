[project]
name = "knowops-backend"
version = "0.1.0"
description = "KnowOps — AI Knowledge & Operations Agent Backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Validation & settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Authentication
    "PyJWT[crypto]>=2.15.1,<3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    # Background jobs
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    # Object storage
    "minio>=7.2.0",
    # Vector database
    "qdrant-client>=1.12.0,<1.13",
    # AI / LLM
    "openai>=1.55.0",
    "tiktoken>=0.8.0",
    "fastembed>=0.4.0",
    # Document processing
    "python-multipart>=0.0.18",
    "pypdf>=5.1.0",
    "python-docx>=1.1.0",
    "chardet>=5.2.0",
    # Utilities
    "python-ulid>=3.0.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "prometheus-client>=0.22.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.0",
    "faker>=30.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "celery-types>=0.26.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008", "UP042", "UP046", "UP047"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
