services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — Primary database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: knowops-postgres
    environment:
      POSTGRES_USER: knowops
      POSTGRES_PASSWORD: knowops
      POSTGRES_DB: knowops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowops"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - knowops

  # ---------------------------------------------------------------------------
  # Redis — Job queue and caching
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: knowops-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - knowops

  # ---------------------------------------------------------------------------
  # Qdrant — Vector search engine
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: knowops-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # Each organization gets its own collection; Qdrant opens many files per
    # segment, so the default 1024 fd limit is far too low.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - knowops

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage
  # ---------------------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio@sha256:f74600a1a46330cdbda1ef760d17a96bd6e0f4a6f0a2c49792ca3ee7e4c6fa18
    container_name: knowops-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: knowops
      MINIO_ROOT_PASSWORD: knowops123
      MC_CONFIG_DIR: /tmp/.mc
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mc alias set local http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1
          && mc ready local
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - knowops

  # ---------------------------------------------------------------------------
  # Backend API — FastAPI
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: knowops-backend:local
    container_name: knowops-backend
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    command: [python, scripts/serve.py]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://knowops:knowops@postgres:5432/knowops
      TEST_DATABASE_URL: postgresql+asyncpg://knowops:knowops@postgres:5432/knowops_test
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      QDRANT_HOST: qdrant
      EMBEDDING_CACHE_DIR: /home/knowops/.cache/fastembed
    volumes:
      - embedding_cache:/home/knowops/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - knowops

  # ---------------------------------------------------------------------------
  # Worker — Celery background jobs
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: knowops-backend:local
    container_name: knowops-worker
    command: >
      celery -A app.services.queue.celery_app worker
      --loglevel=info
      --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://knowops:knowops@postgres:5432/knowops
      TEST_DATABASE_URL: postgresql+asyncpg://knowops:knowops@postgres:5432/knowops_test
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      QDRANT_HOST: qdrant
      EMBEDDING_CACHE_DIR: /home/knowops/.cache/fastembed
    volumes:
      - embedding_cache:/home/knowops/.cache
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - knowops

  reconciler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: knowops-backend:local
    container_name: knowops-reconciler
    command: python -m app.services.queue.reconcile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://knowops:knowops@postgres:5432/knowops
      TEST_DATABASE_URL: postgresql+asyncpg://knowops:knowops@postgres:5432/knowops_test
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      QDRANT_HOST: qdrant
      EMBEDDING_CACHE_DIR: /home/knowops/.cache/fastembed
    volumes:
      - embedding_cache:/home/knowops/.cache
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - knowops


  next:
    image: knowops-next:local
    build:
      context: ./frontend
      target: next-runtime
    networks:
      - knowops

  frontend:
    image: knowops-frontend:local
    build:
      context: ./frontend
      target: runtime
    container_name: knowops-frontend
    ports:
      - "3000:8080"
      - "5173:8080"
    depends_on:
      - backend
      - next
    networks:
      - knowops

  test:
    profiles: [test]
    build:
      context: ./backend
      target: test
    environment:
      APP_ENV: testing
      SECRET_KEY: test-secret-key-that-is-at-least-32-characters-long
      JWT_SECRET_KEY: test-jwt-secret-key-at-least-32-characters-long
      DATABASE_URL: postgresql+asyncpg://knowops:knowops@postgres:5432/knowops_test
      TEST_DATABASE_URL: postgresql+asyncpg://knowops:knowops@postgres:5432/knowops_test
      LLM_API_KEY: test-key
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - knowops

volumes:
  embedding_cache:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:

networks:
  knowops:
    driver: bridge
