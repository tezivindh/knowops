images:
  backend: { repository: knowops-backend, tag: local, pullPolicy: IfNotPresent }
  frontend: { repository: knowops-frontend, tag: local, pullPolicy: IfNotPresent }
  next: { repository: knowops-next, tag: local, pullPolicy: IfNotPresent }
imagePullSecrets: []
secretName: knowops-secrets
replicas:
  backend: 2
  frontend: 2
  worker: 1
config:
  APP_ENV: production
  DEBUG: "false"
  CORS_ORIGINS: '["http://knowops.local"]'
  EMBEDDING_PROVIDER: local
  EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
  EMBEDDING_DIMENSIONS: "384"
  EMBEDDING_CACHE_DIR: /home/knowops/.cache/fastembed
  MINIO_BUCKET: knowops-documents
  LLM_BASE_URL: https://api.groq.com/openai/v1
  LLM_PRIMARY_MODEL: openai/gpt-oss-120b
  LLM_FALLBACK_MODEL: openai/gpt-oss-20b
  JWT_ALGORITHM: HS256
resources:
  backend:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: "1", memory: 768Mi }
  next:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 384Mi }
  nginx:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }
  worker:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
ingress:
  enabled: true
  className: traefik
  host: knowops.local
  annotations: {}
  tls: []
persistence:
  enabled: true
  storageClass: ""
  size: 2Gi
metrics:
  serviceMonitor:
    enabled: false
    labels: { release: monitoring }
