{{- $services := list
  (dict "name" "postgres" "image" "postgres:16-alpine" "port" 5432 "uid" 70 "path" "/var/lib/postgresql/data" "memory" "384Mi")
  (dict "name" "redis" "image" "redis:7-alpine" "port" 6379 "uid" 999 "path" "/data" "memory" "128Mi")
  (dict "name" "minio" "image" "cgr.dev/chainguard/minio@sha256:f74600a1a46330cdbda1ef760d17a96bd6e0f4a6f0a2c49792ca3ee7e4c6fa18" "port" 9000 "uid" 65532 "path" "/data" "memory" "512Mi")
  (dict "name" "qdrant" "image" "qdrant/qdrant:v1.12.4" "port" 6333 "uid" 1000 "path" "/qdrant/storage" "memory" "384Mi")
}}
{{- range $service := $services }}
{{- if $.Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "knowops.name" $ }}-{{ $service.name }}
  labels:
    {{- include "knowops.labels" $ | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with $.Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests: { storage: {{ $.Values.persistence.size }} }
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knowops.name" $ }}-{{ $service.name }}
  labels:
    {{- include "knowops.labels" $ | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: {{ include "knowops.name" $ }}-{{ $service.name }} }
  template:
    metadata:
      labels: { app: {{ include "knowops.name" $ }}-{{ $service.name }} }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: {{ $service.uid }}
        runAsGroup: {{ $service.uid }}
        fsGroup: {{ $service.uid }}
      containers:
        - name: {{ $service.name }}
          image: {{ $service.image | quote }}
          {{- if eq $service.name "postgres" }}
          env:
            - { name: POSTGRES_USER, value: knowops }
            - { name: POSTGRES_DB, value: knowops }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $.Values.secretName }}, key: POSTGRES_PASSWORD }
          {{- else if eq $service.name "redis" }}
          args: [redis-server, --appendonly, "yes", --dir, /data]
          {{- else if eq $service.name "minio" }}
          args: [server, /data, --console-address, ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: {{ $.Values.secretName }}, key: MINIO_ACCESS_KEY }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $.Values.secretName }}, key: MINIO_SECRET_KEY }
          {{- end }}
          ports: [{ name: service, containerPort: {{ $service.port }} }]
          securityContext:
            {{- include "knowops.security" $ | nindent 12 }}
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: {{ $service.memory }} }
          readinessProbe:
            tcpSocket: { port: service }
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket: { port: service }
            initialDelaySeconds: 30
          volumeMounts:
            - { name: data, mountPath: {{ $service.path }} }
            {{- if eq $service.name "qdrant" }}
            - { name: snapshots, mountPath: /qdrant/snapshots }
            {{- end }}
      volumes:
        - name: data
          {{- if $.Values.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ include "knowops.name" $ }}-{{ $service.name }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if eq $service.name "qdrant" }}
        - name: snapshots
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "knowops.name" $ }}-{{ $service.name }}
  labels:
    {{- include "knowops.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app: {{ include "knowops.name" $ }}-{{ $service.name }} }
  ports: [{ name: service, port: {{ $service.port }}, targetPort: service }]
---
{{- end }}
