# Reference only. scripts/bootstrap-secrets.py generates real values directly in the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: knowops-secrets
  namespace: knowops
type: Opaque
stringData:
  SECRET_KEY: REPLACE_WITH_A_RANDOM_SECRET
  JWT_SECRET_KEY: REPLACE_WITH_A_DIFFERENT_RANDOM_SECRET
  DATABASE_URL: postgresql+asyncpg://knowops:REPLACE_PASSWORD@knowops-postgres:5432/knowops
  POSTGRES_PASSWORD: REPLACE_PASSWORD
  MINIO_ACCESS_KEY: knowops
  MINIO_SECRET_KEY: REPLACE_WITH_PRIVATE_STORAGE_PASSWORD
  LLM_API_KEY: REPLACE_WITH_YOUR_GROQ_KEY
